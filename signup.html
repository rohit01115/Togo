<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title><style>
        body{
           
      background-color: black;
        }
        .te{
     width: 200px;
     height: 300px;
     background-color: red;
     border-radius: 10px;
     margin: 100px auto;
     display: flex;
     flex-direction: column;  
     align-items: center;     
     /* box-shadow: #0b0b0b 5px 5px 10px; */
     /* padding-top: 30px;  */
       animation:shadowMove 3s infinite linear;
}

@keyframes shadowMove{
    0%{
        box-shadow: 10px 0px 20px red;
    }
    25%{
        box-shadow: 0px 10px 20px blue;
    }
    50%{
        box-shadow: -10px 0px 20px green;
    }
    75%{
        box-shadow: 0px -10px 20px yellow;
    }
    100%{
        box-shadow: 10px 0px 20px rgb(217, 11, 239);
    }
}
    
     .in{
     padding: 10px;
     border-radius: 8px;
     border: 1px solid #ccc;
     outline: none;
    } .in:hover{
      border: 1px solid #007bff;
    }
     form{display: flex;
      flex-direction: column;
      gap: 15px;
      width: 70%; 
     }
        .ty{
        background-color: #10db21;
        color: rgb(248, 251, 251);
        border: none;
        padding: 10px;
        border-radius: 8px;
        cursor: pointer;
        
        h1{
            color: #f4f3f0;
        }
    </style>
</head>
<body>
    
    <div class="te">
        <h1>Sign Up</h1>
    <form>
        <input id="username" class="in" type="text" placeholder="Username" required>
        <input id="email" class="in" type="email" placeholder="Email" required>
        <input id="password" class="in" type="password" placeholder="Password" required>
        <button class="ty" type="submit">Sign Up</button>
    </form></div>
</body>
</html>
