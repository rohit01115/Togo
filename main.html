<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-image: url(pexels-ifreestock-572487.jpg);
            background-size: cover;
                background-position: center;
                background-attachment: fixed;

        }
        .qw{
    width: 400px;
    height: 300px;
    background-color: white;
    border-radius: 20px;
    margin: 200px auto;
    box-shadow: inset 0 0 20px #0b979e;

    display: flex;
    flex-direction: column;   /* stack items */
    align-items: center;      /* center horizontally */
    padding-top: 40px;
}

.hed{
    margin-bottom: 30px;
    color: #0b979e;
}

form{
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 70%;
}

.in{
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    outline: none;
}

.in:focus{
    border-color: #0b979e;
}

.ty{
    background-color: #0b979e;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
}

.ty:hover{
    background-color: #097b80;
}
    </style>
</head>
<body>
    <h1></h1>
   <div class="qw">
    <h2 class="hed">Login</h2>

    <form onsubmit="login()">
        <input id="username" class="in" type="text" placeholder="Username" required>
        <input id="password" class="in" type="password" placeholder="Password" required>
        <button class="ty" type="submit">Login</button>
    </form>
</div>
</body>
</html>
