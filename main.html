<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

/* Background */

body{
    background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
    url("images/pexels-ifreestock-572487.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

/* Login Box */

.qw{
    width: 400px;
    height: 320px;
    background-color: white;
    border-radius: 20px;
    margin: 200px auto;
    box-shadow: inset 0 0 20px #0b979e;

    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 30px;
    transition: box-shadow 0.1s;
}

.hed{
    margin-bottom: 25px;
    color: #0b979e;
}

/* Form */

form{
    display:flex;
    flex-direction:column;
    gap:20px;
    width:70%;
}

/* Floating Input Container */

.input-box{
    position:relative;
    width:100%;
}

/* Input */

.input-box input{
    width:100%;
    padding:12px;
    border:2px solid #ccc;
    border-radius:8px;
    outline:none;
    background:transparent;
    font-size:14px;
    transition:0.3s;
}

/* Label */

.input-box label{
    position:absolute;
    left:12px;
    top:12px;
    color:#888;
    pointer-events:none;
    transition:0.3s;
    background:white;
    padding:0 4px;
}

/* Floating Animation */

.input-box input:focus + label,
.input-box input:valid + label{
    top:-8px;
    font-size:12px;
    color:#0b979e;
}

.input-box input:focus{
    border-color:#0b979e;
}

/* Button */

.ty{
    background-color:#0b979e;
    color:white;
    border:none;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
}

.ty:hover{
    background-color:#18c0cf;
}

/* Signup Link */

.link{
    text-align:center;
    margin-top:5px;
    color:#0b979e;
    text-decoration:none;
    font-size:14px;
}

</style>
</head>

<body>

<div class="qw" id="qw">

<h2 class="hed">Login</h2>

<form onsubmit="login(event)">

<div class="input-box">
<input id="username" type="text" required>
<label>Username</label>
</div>

<div class="input-box">
<input id="password" type="password" required>
<label>Password</label>
</div>

<button class="ty" type="submit">Login</button>

<a href="signup.html" class="link">
Don't have an account? Sign up
</a>

</form>

</div>

<script>

function login(event) {
    event.preventDefault(); 

    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    if (username === 'A' && password === 'A') {
        alert('Login successful!');
        window.location.href = 'PG.html';
    } 
    else {
        alert('Invalid username or password');
    }
}

/* Moving Shadow Animation */

const qw = document.getElementById("qw");

document.addEventListener("mousemove", (e) => {

    const x = (window.innerWidth / 2 - e.clientX) / 20;
    const y = (window.innerHeight / 2 - e.clientY) / 20;

    qw.style.boxShadow = `${x}px ${y}px 20px rgba(0,0,0,0.6)`;

});

</script>

</body>
</html>
