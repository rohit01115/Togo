<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
  font-family: Arial;
}

.menu{
  position: relative;
  display: inline-block;
}

.menu-btn{
  padding:10px 20px;
  font-size:18px;
  border:none;
  background:#333;
  color:white;
  cursor:pointer;
  border-radius: 10px;
}

.menu-content{
  display:none;
  position:absolute;
  background:#f1f1f1;
  min-width:150px;
  box-shadow:0 5px 10px rgba(0,0,0,0.2);
}

.menu-content a{
  display:block;
  padding:10px;
  text-decoration:none;
  color:black;
}

.menu-content a:hover{
  background:#ddd;
}

.menu:hover .menu-content{
  display:block;
}
    </style>
</head>
<body>
    <div class="menu" >
        <button class="menu-btn">
    ☰ 
     <div class="menu-content">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
  </div>
    </div>
</body>
</html>
