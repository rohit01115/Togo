<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        body{
  font-family: Arial;
  background-color: aqua;
}

.menu{
  position: relative;
  display: inline-block;
  width: 100%;
  align-items: center;
  /* justify-content: center; */
  display: flex;
}

.menu-btn{
  padding:10px 20px;
  font-size:18px;
  border:none;
  background:#333;
  color:white;
  cursor:pointer;
  border-radius: 10px;
}

.menu-content{
  display:none;
  position: absolute;
  background:#fdfcfc;
  min-width:150px;
  box-shadow:0 5px 10px rgba(0,0,0,0.2);
}

.menu-content a{
  display:block;
  padding:10px;
  text-decoration: none;
  color:rgb(237, 12, 12);
}

.menu-content a:hover{
  background:#dddddd;
}

.menu:hover .menu-content{
  display:block;
}
    </style>
</head>
<body>
    <div class="menu" >
        <button class="menu-btn">
    ☰ 
     <div class="menu-content">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
  </div>
  
    </div>
</body>
</html>
